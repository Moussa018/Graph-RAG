services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: graphrag
      POSTGRES_PASSWORD: graphrag
      POSTGRES_DB: graphrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/graphrag-password
    ports:
      - "7474:7474"   # Neo4j Browser : http://localhost:7474
      - "7687:7687"   # Bolt
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
